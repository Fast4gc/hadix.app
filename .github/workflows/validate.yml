name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell-syntax:
    name: Shell syntax (bash -n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate all .sh files
        run: |
          set -e
          fail=0
          while IFS= read -r -d '' f; do
            if ! bash -n "$f"; then
              echo "::error file=$f::bash -n falhou"
              fail=1
            fi
          done < <(find . -name '*.sh' -print0)
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "OK: todos os scripts bash -n passaram"

  shellcheck:
    name: Shellcheck (se disponivel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck (avisos nao bloqueiam)
        run: |
          shellcheck -S warning $(find . -name '*.sh') || true

  node-check:
    name: Node syntax (node --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JS syntax
        run: |
          set -e
          fail=0
          while IFS= read -r -d '' f; do
            if ! node --check "$f" 2>/tmp/node_err.txt; then
              echo "::error file=$f::node --check falhou: $(cat /tmp/node_err.txt)"
              fail=1
            fi
          done < <(find . -name '*.js' -not -path './node_modules/*' -print0)
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "OK: todos os .js passaram no node --check"
