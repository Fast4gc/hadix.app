# Preset global de WebSocket do Hadix.app (instalado em /etc/nginx/conf.d/)
# So define o mapa de upgrade de conexao, necessario no contexto http global.
# NAO usa placeholders. O bloco server de cada app (porta/dominio) e gerado
# pelos scripts create-*/vps via templates/nginx/api.conf ou static.conf (sed).

# Habilita upgrade de conexao para WebSocket (Socket.IO, bots c/ painel web)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
